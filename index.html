<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Pricing Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Pricing Calculator</h1>
        <p>Calculate your total cost with discounts and tax.</p>
        <form> 
            <div>
                <label for="unitPrice">Unit Price ($):</label>
                <input type="number" id="unitPrice" name="unitPrice" min="0.01" step="0.01" required>
            </div>
            <div>
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" name="quantity" value="1" min="1" step="1" required>
            </div>
            
            <div>
                <button type="submit" id="calculateButton">Calculate Total</button>
            </div>
        </form>
        <section id="results" aria-live="polite">
            <h2>Price Breakdown</h2>
            <p id="subtotal">Subtotal: $0.00</p>
            <p id="discount">Discount: $0.00</p>
            <p id="tax">Tax: $0.00</p>
            <p id="total">Total: $0.00</p>
        </section>
    </main>

</body>
</html>
